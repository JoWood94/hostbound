<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0008" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ABYSS TIDE" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Russo+One&family=DotGothic16&display=swap" />
  <title>ABYSS TIDE</title>
  <style>
    html, body { margin: 0; padding: 0; background: #060004; overflow: hidden; overscroll-behavior: none; }
    /* iOS home-screen apps with a translucent status bar size the viewport as
       screen minus status bar, leaving a black strip at the bottom. Growing the
       root by the top inset makes it cover the whole screen. */
    html { height: 100%; min-height: calc(100% + env(safe-area-inset-top)); }
    body { min-height: inherit; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
