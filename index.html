<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0008" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HOSTBOUND" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" />
  <title>HOSTBOUND</title>
  <style>
    html, body { margin: 0; padding: 0; background: #060004; overflow: hidden; overscroll-behavior: none; }
    /* iOS home-screen apps with a translucent status bar size the viewport as
       screen minus status bar, leaving a black strip at the bottom. Growing the
       root by the top inset makes it cover the whole screen. */
    html { height: 100%; min-height: calc(100% + env(safe-area-inset-top)); }
    body { min-height: inherit; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; }
    /* Portrait only. The manifest asks for it, but iOS ignores that, so a
       phone or tablet held sideways gets this screen instead of the game. */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #000; color: #d83cd8;
      flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      font: 700 15px Quicksand, system-ui, sans-serif; letter-spacing: 0.12em; }
    #rotate svg { width: 64px; height: 64px; animation: turn 1.8s cubic-bezier(.6,0,.3,1) infinite; }
    @keyframes turn { 0%, 25% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
    @media (orientation: landscape) and (hover: none) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <rect x="20" y="6" width="24" height="52" rx="8" /><line x1="29" y1="51" x2="35" y2="51" />
    </svg>
    ROTATE TO PORTRAIT
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
